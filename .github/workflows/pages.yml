name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/video/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deployment at a time. Runs queued behind the in-flight one are skipped,
  # but the in-flight one is never cancelled — a half-cancelled Pages deploy can
  # leave the environment stuck on a pending deployment.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The videos live once, in docs/video/ (the README links the promo too);
      # the site's <video> players expect them at video/, so stage copies into
      # the artifact instead of committing the mp4s a second time under site/.
      # Light-theme cuts sit in docs/video/light/ and are served from video/light/.
      # Voiced cuts per language sit in docs/video/<lang>[/light]/; a language
      # cut with no light twin is served for both themes, so the voice stays put.
      - run: |
          mkdir -p site/video/light && cp docs/video/*.mp4 site/video/ && cp docs/video/light/*.mp4 site/video/light/
          for d in docs/video/*/; do
            lang=$(basename "$d"); [ "$lang" = light ] && continue
            mkdir -p "site/video/$lang/light" && cp "$d"*.mp4 "site/video/$lang/"
            if compgen -G "${d}light/*.mp4" >/dev/null; then cp "$d"light/*.mp4 "site/video/$lang/light/"; fi
            for f in "$d"*.mp4; do
              [ -f "site/video/$lang/light/$(basename "$f")" ] || cp "$f" "site/video/$lang/light/"
            done
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
