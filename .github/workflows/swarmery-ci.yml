name: swarmery-ci

# push is main-only (2026-10-27): on a feat/** branch the pull_request run
# already covers the same tree.
on:
  push:
    branches: [main]
    paths:
      - 'tools/swarmery/**'
      - '.github/workflows/swarmery-ci.yml'
      # internal/approvals/prodguard_parity_test.go reads these: a change to
      # either side of the hook/daemon pattern parity must run that test.
      - 'plugins/core/hooks/lib/prod-deploy-patterns.txt'
      - 'plugins/core/hooks/prod-deploy-guard.sh'
      - 'scripts/tests/fixtures/prod-deploy-patterns/**'
      # internal/approvals/guardpack_parity_test.go and
      # internal/api/redact_parity_test.go read guard-pack's pattern files and
      # their TS mirrors: a change to either side must run those tests.
      - 'plugins/guard-pack/hooks/patterns/**'
      - 'plugins/guard-pack/hooks/testkit.ts'
  pull_request:
    branches: [main, 'feat/**']
    paths:
      - 'tools/swarmery/**'
      - '.github/workflows/swarmery-ci.yml'
      # internal/approvals/prodguard_parity_test.go reads these: a change to
      # either side of the hook/daemon pattern parity must run that test.
      - 'plugins/core/hooks/lib/prod-deploy-patterns.txt'
      - 'plugins/core/hooks/prod-deploy-guard.sh'
      - 'scripts/tests/fixtures/prod-deploy-patterns/**'
      # internal/approvals/guardpack_parity_test.go and
      # internal/api/redact_parity_test.go read guard-pack's pattern files and
      # their TS mirrors: a change to either side must run those tests.
      - 'plugins/guard-pack/hooks/patterns/**'
      - 'plugins/guard-pack/hooks/testkit.ts'

# A new push to a PR branch cancels its now-stale run; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: tools/swarmery

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the migration-number check needs the merge-base of
          # the PR and main.
          fetch-depth: 0

      - name: Migration numbers above main's
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Against main even for a PR into feat/**: a stacked branch lands on
          # main, so main's numbering is the one a new migration must clear.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/check-migration-numbers.sh --base origin/main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/swarmery/web/package-lock.json

      - name: Build web
        working-directory: tools/swarmery/web
        run: |
          npm ci
          npm run build

      - name: Test web
        working-directory: tools/swarmery/web
        run: npm test

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/swarmery/go.mod
          cache-dependency-path: tools/swarmery/go.sum
          check-latest: true

      - name: gofmt
        run: |
          set -euo pipefail
          # Tracked files only, so nothing vendored under web/node_modules counts.
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat these files (run: gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage floor)
        run: |
          set -euo pipefail
          go test -timeout 30m -coverprofile=coverage.out ./...
          # Coverage-gate scope: the floor measures unit-testable logic only.
          # The CLI entrypoint (cmd/swarmery) and go:embed-only packages
          # (web, internal/docsfs) carry no unit-testable statements — they are
          # exercised via the daemon/integration path — so they are excluded
          # from the denominator to keep the floor honest and stable.
          grep -vE '/(cmd/swarmery|web|internal/docsfs)/' coverage.out > coverage.gated.out
          total=$(go tool cover -func=coverage.gated.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "gated coverage (excl. entrypoint & embed): ${total}%"
          # Regression floor. Raise as coverage improves;
          # never set it above the live number or CI blocks legitimate work.
          floor=70.0
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' \
            || { echo "coverage ${total}% is below floor ${floor}%"; exit 1; }

      - name: Build binary
        run: go build -o swarmery ./cmd/swarmery
