name: notch-release

# Cut a versioned Swarmery Notch build by pushing a tag:
#   git tag notch-v0.1.0 && git push origin notch-v0.1.0
# The job builds a release SwiftPM binary, assembles it into Swarmery
# Notch.app (`make bundle` -- unsigned, see tools/notch/README.md's Gatekeeper
# note), zips it, and publishes the zip on a GitHub Release.

on:
  push:
    tags: ['notch-v*']

defaults:
  run:
    working-directory: tools/notch

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub Release + upload the zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tools/notch/.build
          key: ${{ runner.os }}-notch-spm-${{ hashFiles('tools/notch/Package.swift', 'tools/notch/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-notch-spm-

      - name: swift test
        run: swift test

      - name: make bundle
        run: make bundle

      - name: Zip the app bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#notch-}"
          mkdir -p dist-release
          zip_name="SwarmeryNotch-${version}-macos.zip"
          ( cd dist && zip -r -y "../dist-release/${zip_name}" "Swarmery Notch.app" )
          ( cd dist-release && shasum -a 256 "$zip_name" > SHA256SUMS )
          echo "NOTCH_ZIP_PATH=dist-release/${zip_name}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$NOTCH_ZIP_PATH" dist-release/SHA256SUMS
