name: notch-ci

on:
  push:
    branches: [main, 'feat/**']
    paths: ['tools/notch/**', '.github/workflows/notch-ci.yml']
  pull_request:
    branches: [main, 'feat/**']
    paths: ['tools/notch/**', '.github/workflows/notch-ci.yml']

defaults:
  run:
    working-directory: tools/notch

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/notch/.build
          key: ${{ runner.os }}-notch-spm-${{ hashFiles('tools/notch/Package.swift', 'tools/notch/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-notch-spm-

      - name: swift build (release)
        run: swift build -c release

      - name: swift test
        run: swift test
