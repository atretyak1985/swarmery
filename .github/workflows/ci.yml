name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON manifests
        run: |
          set -e
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json \
                   plugins/*/requirements.json \
                   plugins/*/hooks/hooks.json overlays/_schema/*.json overlays/example/*.json; do
            [ -f "$f" ] || continue
            node -e "JSON.parse(require('fs').readFileSync('$f'))" \
              && echo "ok $f" || { echo "INVALID JSON: $f"; exit 1; }
          done

      - name: Pack requirements in sync with the overlay schema
        run: bash scripts/check-plugin-requirements.sh

      - name: Shell syntax (bash -n)
        run: |
          set -e
          find plugins scripts -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; exit 1; }
            echo "ok $f"
          done

      - name: ShellCheck (error severity)
        run: |
          set -e
          # Error-severity floor: catch genuine bugs (bad redirects, unset
          # command substitutions) without failing on style. The pre-commit
          # gate runs shellcheck at default severity locally for the stricter
          # developer signal; this is the hard CI floor.
          find plugins scripts -name '*.sh' -print0 \
            | xargs -0 shellcheck -S error

      - name: Shell tests
        run: |
          # Every suite in scripts/tests/, discovered — not listed. A hand-kept
          # list silently stops covering the next suite someone writes, which is
          # how bash-shape-guard.test.sh and read-before-write.test.sh sat green
          # locally and unrun in CI.
          set -euo pipefail
          failed=0
          for t in scripts/tests/*.test.sh; do
            echo "── $t"
            bash "$t" || failed=1
          done
          [ "$failed" -eq 0 ]

      - name: Agent frontmatter (name + description)
        run: |
          python3 - <<'PY'
          import glob, sys
          bad = []
          for f in glob.glob('plugins/*/agents/*.md'):
              lines = open(f, encoding='utf-8').read().splitlines()
              ok = lines and lines[0].strip() == '---' \
                   and any(l.startswith('name:') for l in lines[:15]) \
                   and any(l.startswith('description:') for l in lines[:15])
              if not ok: bad.append(f)
          print(f"checked={len(glob.glob('plugins/*/agents/*.md'))} problems={len(bad)}")
          for b in bad: print("PROBLEM:", b)
          sys.exit(1 if bad else 0)
          PY

      - name: Component reference integrity
        run: |
          # Dead skills: refs, dead ${CLAUDE_PLUGIN_ROOT} paths, pinned or
          # retired model ids, and frontmatter Claude Code ignores on plugin
          # subagents all fail here — the 2026-09 audit's bug class, closed.
          bash scripts/validate-agent-refs.sh

      - name: Claude Code version floor (boundary behaviour)
        run: |
          # core 3.0 leans on native harness behaviour older builds lack, and
          # session-start.sh warns below the floor. The comparison is sort -V,
          # not lexical, because 2.1.16 < 2.1.160 is exactly the case a string
          # compare gets backwards. plugin.json cannot express a minimum
          # version — Claude Code silently ignores unknown top-level fields —
          # so this check and the hook are where the floor actually lives.
          bash scripts/tests/cc-version-floor.test.sh

      - name: System item docs coverage
        run: |
          # Every registrable agent, skill and command owes its reader one
          # `# How to use` block with the four required subsections. No
          # DOCS_MAX_PROBLEMS override: the corpus was backfilled to 134/134,
          # so the default of 0 is the ratchet. A ratchet with slack is not a
          # ratchet — never raise this above the live number.
          bash scripts/docgen/check-coverage.sh

      - name: Counts are current
        run: |
          # Every published count — the pack table in README.md, both stat rows
          # on the landing page — is spliced in from the corpus itself by
          # scripts/docgen/counts.sh. This regenerates them into a throwaway copy
          # and diffs. It bites when a pack, an agent or a skill lands and the
          # numbers are left behind, which is the only way they have ever gone
          # wrong: every one of them was correct on the day it was typed.
          bash scripts/docgen/apply-counts.sh --check

      - name: Flavor scan (neutrality ratchet)
        env:
          FLAVOR_BRAND: ${{ vars.FLAVOR_BRAND }}
          FLAVOR_DOMAIN: ${{ vars.FLAVOR_DOMAIN }}
        run: |
          if [ -z "$FLAVOR_BRAND" ]; then
            echo "FLAVOR_BRAND repo variable not set — skipping neutrality scan (see docs/NEUTRALITY.md)"
            exit 0
          fi
          out=$(bash scripts/scan-flavor.sh)
          echo "$out"
          echo "$out" | grep -q '✓ clean' || { echo "FLAVOR TOKENS FOUND — core must stay vendor-neutral"; exit 1; }

  agent-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - name: Run agent evals + gate (skips cleanly without ANTHROPIC_API_KEY)
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping agent evals."
            echo "The eval gate is advisory here; its logic is still regression-tested"
            echo "by scripts/tests/eval-gate.test.sh in the validate job (no API key needed)."
            exit 0
          fi
          npm ci
          npx promptfoo eval -c promptfooconfig.yaml -o results.json
          bash ../scripts/eval-gate.sh results.json

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so --log-opts=--all can scan every commit

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --log-opts="--all" --redact --no-banner --verbose
