name: CodeQL

# Advanced setup for every language except the macOS-built tools/notch one,
# which has its own path-gated workflow (only when tools/notch/** changes), so a
# PR that leaves tools/notch alone does not wait on a macOS build. Uploads are
# rejected while the repository's CodeQL *default* setup is still enabled —
# switch it off after merging this file.
#
# No push-to-main run (2026-10-27, Actions minutes): every change reaches main
# through a PR that is analysed here, and the weekly schedule keeps main's
# alert baseline fresh. Docs-only PRs are skipped — no analysed language changes.

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'articles/**'
      - 'site/**'
  schedule:
    - cron: '23 4 * * 1'

# A new push to a PR branch cancels its now-stale run; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
