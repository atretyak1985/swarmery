name: CodeQL (Swift)

# Swift analysis of tools/notch, split out of codeql.yml so it runs only when
# Swift changes. The weekly schedule keeps main's Swift alerts fresh.
#
# No actions/cache of tools/notch/.build here (unlike notch-ci.yml): the package
# has zero dependencies, so the cache would hold only compiled objects, and a
# warm cache turns the traced `swift build` into a no-op — CodeQL then sees no
# Swift compiled and the analysis fails.

on:
  push:
    branches: [main]
    paths: ['tools/notch/**', '.github/workflows/codeql-swift.yml']
  pull_request:
    paths: ['tools/notch/**', '.github/workflows/codeql-swift.yml']
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      - name: swift build (release)
        working-directory: tools/notch
        run: swift build -c release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
