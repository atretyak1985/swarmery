name: CodeQL (Swift)

# Swift analysis of tools/notch, split out of codeql.yml so it runs only when
# Swift changes. The weekly schedule keeps main's Swift alerts fresh.
#
# No actions/cache of tools/notch/.build here (unlike notch-ci.yml): the package
# has zero dependencies, so the cache would hold only compiled objects, and a
# warm cache turns the traced `swift build` into a no-op — CodeQL then sees no
# Swift compiled and the analysis fails.

# No push-to-main run (2026-10-27): the PR run plus the weekly schedule cover it,
# and this is a macOS job (10x Linux minutes).
on:
  pull_request:
    paths: ['tools/notch/**', '.github/workflows/codeql-swift.yml']
  schedule:
    - cron: '23 4 * * 1'

# A new push to a PR branch cancels its now-stale run; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      - name: swift build (release)
        working-directory: tools/notch
        run: swift build -c release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
