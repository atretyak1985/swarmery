version: 2
updates:
  # Keep SHA-pinned GitHub Actions current (security patches surface as PRs
  # that bump both the pin and the trailing version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # tools/swarmery Go module.
  - package-ecosystem: gomod
    directory: /tools/swarmery
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # tools/swarmery web (React) dependencies.
  - package-ecosystem: npm
    directory: /tools/swarmery/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    # The @lingui/* packages must stay on one version: a lone @lingui/cli major
    # (#535) rejected lingui.config.ts and broke the web build. Move them together,
    # and take majors by hand (v6 needs the config migrated).
    groups:
      lingui:
        patterns:
          - "@lingui/*"
    ignore:
      - dependency-name: "@lingui/*"
        update-types: ["version-update:semver-major"]
