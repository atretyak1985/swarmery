<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ═══ EDIT: page name — two to four words, a name, never "Name: explainer" ═══ -->
<title>Page name</title>
<meta name="description" content="One sentence: what this page explains and for whom.">
<!-- ═══ EDIT: fonts — pick per subject; every face must cover the page language (Cyrillic needs cyrillic-ext) ═══ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* ═══ EDIT: TOKENS — re-derive the palette and type for every subject. Keep the token NAMES.
   Layout: <one line on the layout concept>.
   Rules: every color is a token; light values on bare :root; the same dark values in BOTH dark blocks.
   --accent marks the one thing the page is about (e.g. "what we add"); --c1..--c3 are categorical series;
   status colors (good/warn/danger) are never reused as series. Validate series colors for color-blindness. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9edf4; --surface-3:#dde3ec;
  --ink:#111a2c; --ink-2:#45506a; --muted:#6c7790; --line:#d6dce6; --line-2:#b9c2d1;
  --accent:#d98c00; --accent-ink:#8a5600; --accent-wash:#fcf0d8;
  --c1:#2a78d6; --c1-ink:#1c5cab; --c1-wash:#e4eefb;
  --c2:#1baf7a; --c2-ink:#0d7350; --c2-wash:#ddf4ea;
  --c3:#4a3aa7; --c3-ink:#4a3aa7; --c3-wash:#ebe8f8;
  --danger:#d03b3b; --danger-ink:#a52828; --danger-wash:#fbe7e7;
  --good:#0ca30c; --good-ink:#006300; --good-wash:#e2f4e2;
  --warn:#fab219; --warn-ink:#875c00; --warn-wash:#fdf1d4;
  --tip-bg:#111a2c; --tip-fg:#f3f5f9; --tip-accent:#f2b44a;
  --on-fill:#ffffff;
  --shadow:0 1px 2px rgba(17,26,44,.06),0 10px 28px rgba(17,26,44,.10);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121b; --surface:#141b27; --surface-2:#1b2433; --surface-3:#243044;
    --ink:#e8edf6; --ink-2:#aab4c7; --muted:#808ba1; --line:#273143; --line-2:#3a4760;
    --accent:#c4830c; --accent-ink:#f2b44a; --accent-wash:#2c2312;
    --c1:#2a6fd0; --c1-ink:#86b4f2; --c1-wash:#15243b;
    --c2:#1f9f71; --c2-ink:#62d3a7; --c2-wash:#112d26;
    --c3:#a48ff0; --c3-ink:#c4b6ff; --c3-wash:#211d3a;
    --danger:#e05252; --danger-ink:#ff9a9a; --danger-wash:#3a1a1e;
    --good:#0ca30c; --good-ink:#5bd65b; --good-wash:#132e19;
    --warn:#fab219; --warn-ink:#f7c75a; --warn-wash:#33290f;
    --tip-bg:#e8edf6; --tip-fg:#111a2c; --tip-accent:#8a5600;
    --on-fill:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#141b27; --surface-2:#1b2433; --surface-3:#243044;
  --ink:#e8edf6; --ink-2:#aab4c7; --muted:#808ba1; --line:#273143; --line-2:#3a4760;
  --accent:#c4830c; --accent-ink:#f2b44a; --accent-wash:#2c2312;
  --c1:#2a6fd0; --c1-ink:#86b4f2; --c1-wash:#15243b;
  --c2:#1f9f71; --c2-ink:#62d3a7; --c2-wash:#112d26;
  --c3:#a48ff0; --c3-ink:#c4b6ff; --c3-wash:#211d3a;
  --danger:#e05252; --danger-ink:#ff9a9a; --danger-wash:#3a1a1e;
  --good:#0ca30c; --good-ink:#5bd65b; --good-wash:#132e19;
  --warn:#fab219; --warn-ink:#f7c75a; --warn-wash:#33290f;
  --tip-bg:#e8edf6; --tip-fg:#111a2c; --tip-accent:#8a5600;
  --on-fill:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
/* ═══ END TOKENS. Everything below is the component library — extend it, do not restyle it with literals. ═══ */

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--c1-ink);text-underline-offset:3px}
p{margin:0 0 1em;max-width:72ch}
ul,ol{margin:0 0 1em}
code,.mono{font-family:var(--f-mono);font-size:.84em}
code,.mono,kbd,pre,.tree,.d .ts,.hint,.eyebrow{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{background:var(--surface-2);padding:.08em .38em;border-radius:5px;overflow-wrap:anywhere}
strong,b{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

/* top bar + navigation */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.top-sec{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-sec b{color:var(--ink-2);font-weight:500}
.keys{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink-2);background:var(--surface)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent)}
.chipnav{display:none;overflow-x:auto;gap:6px;padding:0 16px 10px;scrollbar-width:none}
.chipnav::-webkit-scrollbar{display:none}
.chipnav a{flex:none;font-size:13px;color:var(--ink-2);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chipnav a.on{border-color:var(--accent);color:var(--ink);background:var(--accent-wash)}
.shell{max-width:1320px;margin:0 auto;padding-inline:24px;display:grid;grid-template-columns:212px minmax(0,1fr);gap:48px}
.rail{position:sticky;top:64px;align-self:start;padding-block:28px;max-height:calc(100vh - 64px);overflow:auto}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rail a{display:grid;grid-template-columns:26px 1fr;gap:4px;padding:6px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:14px;line-height:1.35}
.rail a .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.on{background:var(--surface);color:var(--ink);font-weight:500}
.rail a.on .n{color:var(--accent-ink);font-weight:600}
.rail-foot{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
main{min-width:0;padding-block:8px 140px}
@media (max-width:1020px){.shell{grid-template-columns:minmax(0,1fr);gap:0;padding-inline:16px}.rail{display:none}.chipnav{display:flex}.topbar-in{padding:10px 16px}.keys{display:none}}

/* sections & type */
.sec{padding-block:64px 16px;border-top:1px solid var(--line)}
.sec.hero{border-top:0;padding-top:40px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.eyebrow b{color:var(--accent-ink);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,5.2vw,60px);line-height:1.04;letter-spacing:-.035em;margin:.25em 0 .3em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.1vw,34px);line-height:1.14;letter-spacing:-.025em;margin:.35em 0 .55em;text-wrap:balance;max-width:28ch}
h3{font-family:var(--f-body);font-weight:650;font-size:19px;line-height:1.3;margin:2.4em 0 .7em;text-wrap:balance}
.lede{font-size:clamp(17px,1.6vw,19px);line-height:1.6;max-width:66ch}
.lede-sm{font-size:16px;color:var(--ink-2);max-width:70ch}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mt{margin-top:18px}

/* glossary terms + tooltip */
.term{border-bottom:1.5px dotted color-mix(in srgb,var(--ink-2) 75%,transparent);cursor:help}
.term:hover,.term:focus-visible{border-bottom-color:var(--accent);color:var(--ink);outline:none;background:var(--accent-wash);border-radius:3px 3px 0 0}
.tip{position:fixed;left:0;top:0;z-index:70;max-width:min(340px,calc(100vw - 24px));background:var(--tip-bg);color:var(--tip-fg);font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:9px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-family:var(--f-mono);font-weight:600;font-size:11.5px;margin-bottom:3px;color:var(--tip-accent)}

/* buttons, chips */
.more{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent-ink);background:transparent;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;line-height:1.3}
.more:hover{background:var(--accent-wash)}
.more::after{content:"→";font-weight:500}
.btn{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 14px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn[aria-pressed="true"],.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.chip.good{background:var(--good-wash);color:var(--good-ink)} .chip.bad{background:var(--danger-wash);color:var(--danger-ink)}
.chip.warn{background:var(--warn-wash);color:var(--warn-ink)} .chip.accent{background:var(--accent-wash);color:var(--accent-ink)}
.chip.c1{background:var(--c1-wash);color:var(--c1-ink)} .chip.c2{background:var(--c2-wash);color:var(--c2-ink)} .chip.c3{background:var(--c3-wash);color:var(--c3-ink)}
.chip.mono{font-family:var(--f-mono);font-size:11.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.yes{color:var(--good-ink);font-weight:600} .no{color:var(--danger-ink);font-weight:600} .dash{color:var(--muted)}

/* figures + diagram vocabulary (inline SVG: class="d") */
figure{margin:28px 0 8px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.fig .w-md{min-width:620px} .fig .w-lg{min-width:760px}
figcaption{color:var(--ink-2);font-size:14px;margin-top:10px;max-width:84ch;line-height:1.55}
.hint{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.fig-foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:10px}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.legend-row span{display:inline-flex;gap:8px;align-items:center}
.ln-k{width:26px;height:0;border-top:2px solid var(--ink-2)} .ln-k.a{border-top:2px dashed var(--accent)} .ln-k.c1{border-top:2px solid var(--c1)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.d text{font-family:var(--f-body);fill:var(--ink);font-size:13px}
.d .tb{font-weight:600} .d .ts{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.d .tl{fill:var(--ink-2);font-size:11.5px} .d .tl-b{fill:var(--ink-2);font-size:12px;font-weight:600}
.d .td{fill:var(--danger-ink);font-size:11.5px;font-weight:600} .d .ta{fill:var(--accent-ink);font-size:11.5px;font-weight:600}
.d .box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.d .box2{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.d .accent{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.4}
.d .bad{fill:var(--danger-wash);stroke:var(--danger);stroke-width:1.3}
.d .frame{fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:5 5}
.d .frame-s{fill:var(--bg);stroke:var(--line);stroke-width:1}
.d .e{stroke:var(--ink-2);stroke-width:1.5;fill:none}
.d .e-a{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:7 5;fill:none}
.d .e-r{stroke:var(--danger);stroke-width:1.8;stroke-dasharray:6 5;fill:none}
.d .e-1{stroke:var(--c1);stroke-width:2.2;fill:none} .d .e-2{stroke:var(--c2);stroke-width:2.2;fill:none} .d .e-3{stroke:var(--c3);stroke-width:2.2;fill:none}
.d .dotted{stroke-dasharray:2 4}
.d .life{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 5}
.d .hit{stroke:transparent;stroke-width:16;fill:none}
.d .hitbox{fill:transparent}
.d .hot{cursor:pointer}
.d .hot:hover :is(.box,.box2,.accent,.bad),.d .hot:focus-visible :is(.box,.box2,.accent,.bad){stroke:var(--accent);stroke-width:2.4}
.d .hot:focus{outline:none}
.lw1{fill:var(--c1-wash)} .lw2{fill:var(--c2-wash)} .lw3{fill:var(--c3-wash)}
.ls1{fill:var(--surface);stroke:var(--c1);stroke-width:1.4} .ls2{fill:var(--surface);stroke:var(--c2);stroke-width:1.4} .ls3{fill:var(--surface);stroke:var(--c3);stroke-width:1.4}
.mk-ink{fill:var(--ink-2)} .mk-a{fill:var(--accent)} .mk-r{fill:var(--danger)} .mk-1{fill:var(--c1)} .mk-2{fill:var(--c2)} .mk-3{fill:var(--c3)}
/* scenario states for [data-el] inside a .d svg */
.d [data-el]{transition:opacity .2s,stroke .2s}
.d [data-el].off{stroke:var(--line-2);stroke-dasharray:2 6;opacity:.6}
.d g[data-el].down :is(rect,circle){fill:var(--danger-wash);stroke:var(--danger);stroke-width:2}
.d g[data-el].down text{fill:var(--danger-ink)}
.d g[data-el] .x{display:none} .d g[data-el].down .x{display:block}
.d .x line{stroke:var(--danger);stroke-width:2.4}
/* stepper / tabs state */
[data-stepper] svg.stepping [data-step]{opacity:.28} [data-stepper] svg.stepping [data-step].cur{opacity:1}
[data-stepper] [data-step]{cursor:pointer;transition:opacity .2s}
[data-stepper] [data-step].cur :is(.e,.e-a,.e-1,.e-2,.e-3){stroke-width:3}
[data-stepper] [data-step].cur text{font-weight:700}
.d [data-tab-trigger]{cursor:pointer}
.d [data-tab-trigger] .lane-bg{stroke:transparent;stroke-width:2}
.d [data-tab-trigger].on .lane-bg{stroke:var(--ink-2)}
.d [data-tab-trigger]:hover .lane-bg,.d [data-tab-trigger]:focus-visible .lane-bg{stroke:var(--accent)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:18px 0}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr[data-d]{cursor:pointer} tr[data-d]:hover td,tr[data-d]:focus-visible td{background:var(--surface-2)} tr[data-d]:focus-visible{outline:none}
tr.pick td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* statement rows (key + value) */
.rows{display:grid;border-top:1px solid var(--line)}
.rows > *{display:grid;gap:4px;padding:14px 2px;border-bottom:1px solid var(--line)}
.rows .k{font-weight:600} .rows .v{color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
@media (max-width:760px){.cols2{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:32px;align-items:center}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:36px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:18px 20px 18px 0} .fact + .fact{padding-left:20px;border-left:1px solid var(--line)}
.fact .big{font-family:var(--f-display);font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.fact .big small{font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0;margin-left:6px}
.fact p{margin:.5em 0 0;font-size:14.5px;color:var(--ink-2)}
.howto{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:12px 16px;max-width:820px}
.howto .tag{flex:none;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-wash);padding:2px 7px;border-radius:5px;margin-top:2px}
.theses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;margin-top:8px}
.thesis{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:16px 8px 16px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.thesis .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.thesis b{display:block;margin-bottom:2px;color:var(--ink)} .thesis .ds{display:block;color:var(--ink-2);font-size:15px}
.thesis:hover{background:var(--surface)} .thesis:hover b{color:var(--accent-ink)}
@media (max-width:860px){.hero-grid,.facts,.theses{grid-template-columns:minmax(0,1fr)}.fact + .fact{padding-left:0;border-left:0;border-top:1px solid var(--line)}}

/* tiles: clickable grid of short items (button.tile[data-d]) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit}
.tile:hover,.tile:focus-visible{border-color:var(--accent)}
.tile .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)} .tile b{font-size:14.5px;line-height:1.3} .tile span{font-size:13.5px;color:var(--ink-2);line-height:1.45}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}

/* stat + alert list */
.statrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:28px;align-items:start}
.stat{font-family:var(--f-display);font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1}
.stat-sub{font-size:15px;color:var(--ink-2);margin-top:8px;max-width:34ch}
.alerts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.alerts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.alerts li::before{content:"";width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px var(--danger-wash)}
@media (max-width:760px){.statrow{grid-template-columns:minmax(0,1fr)}}

/* cards (generic grid; add .c2/.c3 for column count) */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px}
button.card,.card[data-d]{cursor:pointer} button.card:hover,.card[data-d]:hover,.card:focus-visible{border-color:var(--accent)}
.card .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .id{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--muted)}
.card .tt{font-weight:650;font-size:15.5px;line-height:1.3;color:var(--ink)}
.card .aside{font-size:12.5px;color:var(--muted);margin-left:auto}
.card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.card .gate{font-size:13.5px;border-top:1px dashed var(--line-2);padding-top:6px}
.card .label{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);margin-bottom:2px}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.card.mark{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.cards,.cards.c2{grid-template-columns:minmax(0,1fr)}}

/* stacked 100% bar */
.sbar-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.sbar-legend span{display:inline-flex;align-items:center;gap:7px}
.sbar-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center;margin:12px 0}
.sbar-row .lbl{font-size:14px;font-weight:600;line-height:1.3} .sbar-row .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.sbar{display:flex;gap:2px;height:30px}
.sbar > div{min-width:4px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--on-fill);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.sbar > div:first-child{border-radius:6px 2px 2px 6px} .sbar > div:last-child{border-radius:2px 6px 6px 2px}
.s1{background:var(--c1)} .s2{background:var(--c2)} .s3{background:var(--c3)} .s-ink{background:var(--ink-2)} .s-bad{background:var(--danger)} .s-mute{background:var(--line-2);color:var(--ink)!important}
@media (max-width:620px){.sbar-row{grid-template-columns:minmax(0,1fr);gap:6px}}

/* score bars (one row per option; 5 cells) */
.bars{display:grid;gap:2px}
.bar{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) 150px;gap:14px;align-items:center;padding:7px 8px;border-radius:9px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;width:100%}
button.bar{cursor:pointer} button.bar:hover,button.bar:focus-visible{background:var(--surface-2)}
.bar .nm{font-size:14px;font-weight:500}
.bar .track{height:22px;display:grid;grid-template-columns:repeat(var(--max,5),1fr);gap:2px}
.bar .track i{border-radius:2px;background:var(--surface-3)} .bar .track i.f{background:var(--ink-2)} .bar.best .track i.f{background:var(--accent)}
.bar .sc{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;white-space:nowrap} .bar .sc b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
@media (max-width:700px){.bar{grid-template-columns:minmax(0,1fr) 92px}.bar .track{grid-column:1 / -1;grid-row:2}}

/* stability / level meters */
.meters{display:grid;border-top:1px solid var(--line)}
.meter-row{display:grid;grid-template-columns:minmax(0,1.3fr) 120px minmax(0,1.6fr);gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.meter-row .what b{display:block} .meter-row .what code{font-size:12px} .meter-row .how{color:var(--ink-2)}
.meter{display:flex;gap:3px} .meter i{flex:1;height:8px;border-radius:2px;background:var(--surface-3)}
.meter[data-v="3"] i{background:var(--good)} .meter[data-v="2"] i:nth-child(-n+2){background:var(--warn)} .meter[data-v="1"] i:first-child{background:var(--danger)}
.meter-lbl{font-size:12px;color:var(--muted);margin-top:4px}
@media (max-width:760px){.meter-row{grid-template-columns:minmax(0,1fr) 100px}.meter-row .how{grid-column:1 / -1}}

/* annotated tree */
.tree{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;overflow-x:auto}
.tree .ln{display:grid;grid-template-columns:minmax(220px,max-content) minmax(0,1fr);gap:16px;padding:4px 10px;border-radius:7px;white-space:pre}
.tree .ln .c{font-family:var(--f-body);font-size:13.5px;color:var(--ink-2);white-space:normal}
.tree .k1 .p{color:var(--c1-ink)} .tree .k2 .p{color:var(--c2-ink)} .tree .k3 .p{color:var(--c3-ink)} .tree .kx .p{color:var(--danger-ink)} .tree .ka .p{color:var(--accent-ink)}
@media (max-width:620px){.tree .ln{grid-template-columns:minmax(0,1fr);gap:0}.tree .ln .c{padding-left:2ch;color:var(--muted)}}

/* tabs + panels ([data-tabs] group) */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 0}
.tab{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab .sw{width:10px;height:10px;border-radius:50%}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-top:12px}
.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px}
.panel h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.panel p{margin:0;font-size:15px} .panel ul{margin:0;padding-left:1.1em;font-size:15px} .panel li{margin:.25em 0}
@media (max-width:760px){.panel-grid{grid-template-columns:minmax(0,1fr)}.panel{padding:18px}}

/* inline flow of steps and hash-chain style blocks */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.flow .st{font-size:13.5px;padding:6px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);line-height:1.35}
.flow .st.hl{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.flow .ar{color:var(--muted);font-size:14px}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.blocks .blk{font-family:var(--f-mono);font-size:12px;padding:6px 10px;border-radius:8px;background:var(--c3-wash);border:1px solid color-mix(in srgb,var(--c3) 45%,transparent);line-height:1.4}
.blocks .blk b{display:block;font-family:var(--f-body);font-size:13px} .blocks .blk.bad{background:var(--danger-wash);border-color:var(--danger)}

/* request path: hop → hop → hop */
.hops{display:flex;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.hops .hop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;flex:1 1 140px;text-align:left;font:inherit;color:inherit}
button.hop{cursor:pointer} button.hop:hover,button.hop:focus-visible{border-color:var(--accent)}
.hops .hop.hl{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.hops .hop.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.hops .hop b{display:block;font-size:14px} .hops .hop span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.hops .arr{align-self:center;padding:0 6px;color:var(--muted);font-size:16px}
@media (max-width:760px){.hops{flex-direction:column}.hops .arr{transform:rotate(90deg);align-self:center;padding:2px 0}}

/* forbidden / never list */
.xlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.xi{border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.xi::before{content:"✕";color:var(--danger-ink);font-weight:700;font-size:14px;line-height:1.5}
.xi b{display:block;font-size:14.5px;color:var(--ink)} .xi .ds{display:block;font-size:13.5px;color:var(--ink-2)}
@media (max-width:900px){.xlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.xlist{grid-template-columns:minmax(0,1fr)}}

/* two-part pair (A + B) */
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
.pair .half{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.pair h4{margin:0 0 4px;font-size:15px} .pair .q{font-family:var(--f-mono);font-size:12px;color:var(--accent-ink);margin-bottom:8px} .pair p{margin:0;font-size:14px;color:var(--ink-2)}
.pair .op{align-self:center;font-family:var(--f-display);font-size:24px;color:var(--muted)}
@media (max-width:760px){.pair{grid-template-columns:minmax(0,1fr)}.pair .op{justify-self:center}}

/* threshold scale and time span (to scale; flex values = real units) */
.scale-bar{display:flex;gap:2px;height:28px}
.scale-bar div{display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.scale-bar .g{background:var(--good-wash);color:var(--good-ink);border-radius:6px 2px 2px 6px;border-left:4px solid var(--good)}
.scale-bar .w{background:var(--warn-wash);color:var(--warn-ink)} .scale-bar .x{background:var(--danger-wash);color:var(--danger-ink);border-radius:2px 6px 6px 2px}
.scale-axis{position:relative;height:22px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.scale-axis span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.scale-axis span:first-child{transform:none} .scale-axis span.end{transform:translateX(-100%)}
.marks{position:relative;height:56px;font-size:12.5px;color:var(--ink-2)}
.marks span{position:absolute;top:6px;white-space:nowrap;line-height:1.35}
.marks span::before{content:"";position:absolute;top:-6px;left:0;height:6px;border-left:1.5px solid var(--ink-2)}
.marks .r{transform:translateX(-100%);text-align:right} .marks .r::before{left:auto;right:0}

/* stepper controls */
.step-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.step-ctl [data-step-count]{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.step-panel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;min-height:132px}
.step-panel .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.step-panel h4{margin:.2em 0 .35em;font-size:18px;font-weight:650} .step-panel p{margin:0 0 .5em;font-size:15.5px} .step-panel .tech{font-size:13.5px;color:var(--ink-2)}

/* scenario switcher output */
.sc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sc-out{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px;margin-top:14px}
.sc-out > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sc-out h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.sc-out .o-bad h4{color:var(--danger-ink)} .sc-out .o-good h4{color:var(--good-ink)} .sc-out .o-info h4{color:var(--c1-ink)}
.sc-out p{margin:0;font-size:14px;color:var(--ink-2)}
@media (max-width:760px){.sc-out{grid-template-columns:minmax(0,1fr)}}

/* numbered steps and checklists */
.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
.steps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-wash);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.checks li::before{content:"";width:16px;height:16px;border:1.8px solid var(--good);border-radius:4px;margin-top:4px}
@media (max-width:900px){.steps,.steps.two,.checks{grid-template-columns:minmax(0,1fr)}}

/* 2-axis matrix (rows × columns) */
.matrix{display:grid;grid-template-columns:110px repeat(var(--cols,2),minmax(0,1fr));gap:6px}
.matrix .hd{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 10px;align-self:end}
.matrix .rh{font-size:13px;font-weight:600;color:var(--ink-2);padding:12px 10px}
.matrix .cell{border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:64px;border:1px solid var(--line);background:var(--surface)}
.matrix .cell.s3{background:var(--danger-wash);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.matrix .cell.s2{background:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.mx{font:inherit;font-size:13px;line-height:1.35;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;max-width:100%}
button.mx{cursor:pointer} button.mx:hover,button.mx:focus-visible{border-color:var(--accent)}
.mx .tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:6px;white-space:nowrap}
@media (max-width:700px){.matrix{grid-template-columns:72px repeat(var(--cols,2),minmax(0,1fr))}.matrix .rh{font-size:12px;padding:10px 4px}.mx{font-size:12px}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}

footer.foot{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);display:grid;gap:6px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:60;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dr-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.dr-kicker{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.dr-title{font-family:var(--f-display);font-size:21px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin:0;grid-column:1}
.dr-close{grid-row:1 / span 2;grid-column:2;font:inherit;font-size:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.dr-body{padding:18px 22px 48px;overflow:auto;font-size:15px;line-height:1.6}
.dr-body > :first-child{margin-top:0}
.dr-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:1.6em 0 .5em;font-weight:600}
.dr-body ul,.dr-body ol{padding-left:1.15em} .dr-body li{margin:.35em 0}
.dr-body pre{background:var(--surface-2);padding:12px 14px;border-radius:10px;overflow-x:auto;font-family:var(--f-mono);font-size:12px;line-height:1.55;margin:.6em 0 1em}
.dr-body .tbl-wrap{margin:10px 0 14px} .dr-body table{font-size:13px} .dr-body th,.dr-body td{padding:8px 10px}
.dr-body .src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:1.4em;padding-top:10px;border-top:1px dashed var(--line-2);line-height:1.6}
.dr-body .note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.dr-body dl{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 14px;margin:8px 0 14px;font-size:14px}
.dr-body dt{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:2px} .dr-body dd{margin:0}
@media (max-width:520px){.dr-body dl{grid-template-columns:minmax(0,1fr)}}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(8,12,20,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
@media (min-width:1200px){.scrim{display:none}}

     The rail and the phone chip-nav are built from these automatically. Delete this sample. ═══ -->
<section class="sec hero" id="top" data-name="Overview">
  <div class="eyebrow"><b>Subject</b><span>what this page is · date</span></div>
  <h1>The thesis in one line.</h1>
  <p class="lede">Plain-language summary. Jargon gets a <span data-t="sample">dotted term</span>; technical depth goes behind <button class="more" data-d="sample">Details</button>.</p>

</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drTitle" aria-hidden="true" inert>
  <div class="dr-head">
    <div class="dr-kicker" id="drKicker"></div>
    <button class="dr-close" id="drClose" type="button">Close <kbd>Esc</kbd></button>
    <h2 class="dr-title" id="drTitle"></h2>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>

<!-- ═══ DATA: glossary terms for [data-t]. { "key": ["Term", "One plain sentence."] } ═══ -->
<script type="application/json" id="glossary">
{"sample": ["dotted term", "A word a newcomer would not know, defined in one plain sentence."]}
</script>

<!-- ═══ DATA: drawer entries for [data-d], when JSON is easier than a <template>.
     { "key": { "k": "kicker", "t": "Title", "html": "<p>…</p>" } }. Write "<\/" for "</" inside strings. ═══ -->
<script type="application/json" id="details">
{}
</script>

<!-- ═══ DATA: drawer templates — <template id="d-KEY" data-k="kicker" data-title="Title">…</template>.
     Prefer templates for long technical prose; end with <div class="src">file:line · sources</div>. ═══ -->
<template id="d-sample" data-k="Kicker" data-title="Technical details">
  <p>Implementation notes, protocols, file paths, numbers. Plain text stays on the page; depth lives here.</p>
  <div class="src">source/file.md · section 2</div>
</template>

<!-- ═══ SHELL SCRIPT — do not edit. Behaviors are driven by attributes:
  [data-t=key]            tooltip from #glossary
  [data-d=key]            drawer from <template id="d-key"> or #details
  [data-tabs]             group: [data-tab=k] buttons, [data-panel=k] panels, [data-tab-trigger=k] SVG lanes
  [data-stepper]          group: svg [data-step=n], [data-step-prev|next|all|count|panel], <script type="application/json" data-steps>[{t,p,x}…] (index 0 = overview)
  [data-scenarios]        group: [data-sc=k] buttons, svg [data-el=id], [data-sc-out=field] outputs, <script type="application/json" data-scenario-map>{k:{down:[],off:[],out:{field:"text"}}}
  [data-filter]           group: [data-f=all|tag] buttons, items with [data-tags="a b"]
═══ -->
<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function sanitizeHTML(html) {
  var tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');
  var blocked = 'script,iframe,object,embed,link,meta,base,form';
  $$(blocked, tpl.content).forEach(function (n) { n.remove(); });
  $$('*', tpl.content).forEach(function (el) {
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      var name = a.name.toLowerCase();
      var value = String(a.value || '').trim();
      if (name.indexOf('on') === 0) {
        el.removeAttribute(a.name);
        return;
      }
      if ((name === 'href' || name === 'src' || name === 'xlink:href') && /^javascript:/i.test(value)) {
        el.removeAttribute(a.name);
      }
    });
  });
  return tpl.innerHTML;
}
function island(el) {
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { console.error('[explainer] bad JSON island', el, e); return null; }
}
var GLOSSARY = island(document.getElementById('glossary')) || {};
var DETAILS = island(document.getElementById('details')) || {};

/* navigation */
var sections = $$('main section.sec[id]');
var rail = $('#railList'), chipnav = $('#chipnav'), topSec = $('#topSec');
sections.forEach(function (s, i) {
  var name = s.getAttribute('data-name') || (($('h2', s) || $('h1', s) || {}).textContent || s.id);
  var n = String(i + 1).padStart(2, '0');
  rail.insertAdjacentHTML('beforeend', '<li><a href="#' + s.id + '"><span class="n">' + n + '</span>' + esc(name) + '</a></li>');
  chipnav.insertAdjacentHTML('beforeend', '<a href="#' + s.id + '">' + esc(name) + '</a>');
});
var railLinks = $$('a', rail), chipLinks = $$('a', chipnav), lastIdx = -1;
function currentIndex() { var idx = 0; sections.forEach(function (s, i) { if (s.getBoundingClientRect().top <= 110) idx = i; }); return idx; }
function markActive() {
  if (!sections.length) return;
  var i = currentIndex(); if (i === lastIdx) return; lastIdx = i;
  railLinks.forEach(function (a, j) { a.classList.toggle('on', j === i); if (j === i) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
  chipLinks.forEach(function (a, j) { a.classList.toggle('on', j === i); if (j === i && chipnav.offsetParent) chipnav.scrollTo({ left: a.offsetLeft - 16, behavior: reduce ? 'auto' : 'smooth' }); });
  var nm = sections[i].getAttribute('data-name') || '';
  topSec.innerHTML = '<span class="mono">' + String(i + 1).padStart(2, '0') + '</span> · <b>' + esc(nm) + '</b>';
}
function stepSection(dir) { var i = Math.max(0, Math.min(sections.length - 1, currentIndex() + dir)); if (sections[i]) sections[i].scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
var prog = $('#progress'), ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(function () {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
    markActive(); ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);

/* drawer */
var drawer = $('#drawer'), drK = $('#drKicker'), drT = $('#drTitle'), drB = $('#drBody'), scrim = $('#scrim'), lastFocus = null;
function openD(key) {
  var c = null, tpl = document.getElementById('d-' + key);
  if (tpl) c = { k: tpl.getAttribute('data-k'), t: tpl.getAttribute('data-title'), html: tpl.innerHTML };
  else if (DETAILS[key]) c = DETAILS[key];
  if (!c) { console.warn('[explainer] no drawer content for', key); return; }
  drK.textContent = c.k || ''; drT.textContent = c.t || ''; drB.innerHTML = sanitizeHTML(c.html || ''); drB.scrollTop = 0;
  wire(drB);
  if (!drawer.classList.contains('open')) lastFocus = document.activeElement;
  drawer.classList.add('open'); drawer.removeAttribute('inert'); drawer.setAttribute('aria-hidden', 'false'); scrim.classList.add('show');
  $$('.pick').forEach(function (el) { el.classList.remove('pick'); });
  $('#drClose').focus({ preventScroll: true });
}
function closeD() {
  if (!drawer.classList.contains('open')) return;
  // Move focus out BEFORE hiding the drawer, or the browser blocks aria-hidden on a focused subtree.
  if (lastFocus && lastFocus !== document.body && document.body.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  else if (drawer.contains(document.activeElement)) document.activeElement.blur();
  drawer.classList.remove('open'); drawer.setAttribute('inert', ''); drawer.setAttribute('aria-hidden', 'true'); scrim.classList.remove('show');
}
$('#drClose').addEventListener('click', closeD);
scrim.addEventListener('click', closeD);

/* tooltip */
var tip = $('#tip'), tipFor = null;
function placeTip(el) {
  var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  var x = Math.max(12, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 12));
  var y = r.bottom + 8; if (y + th > window.innerHeight - 12) y = r.top - th - 8;
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function showTip(el) {
  var g = GLOSSARY[el.getAttribute('data-t')]; if (!g) return;
  tip.innerHTML = '<b>' + esc(g[0]) + '</b>' + esc(g[1]); tip.classList.add('show'); tipFor = el; placeTip(el);
}
function hideTip() { tip.classList.remove('show'); tipFor = null; }
document.addEventListener('mouseover', function (e) { var t = e.target.closest && e.target.closest('.term'); if (t && t !== tipFor) showTip(t); });
document.addEventListener('mouseout', function (e) { var t = e.target.closest && e.target.closest('.term'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', function (e) { var t = e.target.closest && e.target.closest('.term'); if (t) showTip(t); });
document.addEventListener('focusout', function (e) { if (e.target.closest && e.target.closest('.term')) hideTip(); });
window.addEventListener('scroll', function () { if (tipFor) hideTip(); }, { passive: true });

/* make [data-t]/[data-d] interactive (also inside drawer content) */
function wire(root) {
  $$('[data-t]', root).forEach(function (el) { if (el.classList.contains('term')) return; el.classList.add('term'); if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0'); });
  $$('[data-d], [data-tab-trigger], [data-step]', root).forEach(function (el) {
    var tag = el.tagName.toLowerCase(); if (tag === 'button' || tag === 'a') return;
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
    if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
  });
}
document.addEventListener('click', function (e) {
  if (!e.target.closest) return;
  var term = e.target.closest('.term'), d = e.target.closest('[data-d]');
  if (term && !d) { if (tipFor === term) hideTip(); else showTip(term); return; }
  if (d) { e.preventDefault(); hideTip(); openD(d.getAttribute('data-d')); if (d.matches('tr')) d.classList.add('pick'); return; }
  if (tipFor && !e.target.closest('#tip')) hideTip();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { hideTip(); closeD(); return; }
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-d], [data-tab-trigger], [data-step]') && !t.matches('button, a')) {
    e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (drawer.classList.contains('open')) return;
  if (t.matches && t.matches('input, textarea, select, [contenteditable="true"], [role="tab"]')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); stepSection(e.key === 'ArrowRight' ? 1 : -1); }
});

/* tabs */
$$('[data-tabs]').forEach(function (g) {
  var tabs = $$('[data-tab]', g), panels = $$('[data-panel]', g), lanes = $$('[data-tab-trigger]', g);
  function set(k) {
    tabs.forEach(function (b) { var on = b.getAttribute('data-tab') === k; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
    panels.forEach(function (p) { p.setAttribute('role', 'tabpanel'); p.hidden = p.getAttribute('data-panel') !== k; });
    lanes.forEach(function (l) { l.classList.toggle('on', l.getAttribute('data-tab-trigger') === k); });
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-tab')); }); });
  lanes.forEach(function (l) { l.addEventListener('click', function () { set(l.getAttribute('data-tab-trigger')); }); });
  g.addEventListener('keydown', function (e) {
    if (!e.target.matches('[data-tab]') || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    e.preventDefault(); e.stopPropagation();
    var i = tabs.indexOf(e.target), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    n.focus(); set(n.getAttribute('data-tab'));
  });
  if (tabs[0]) set(tabs[0].getAttribute('data-tab'));
});

/* stepper */
$$('[data-stepper]').forEach(function (g) {
  var steps = island($('script[data-steps]', g)) || [], svg = $('svg', g), cur = 0, last = steps.length - 1;
  var nodes = $$('[data-step]', g), panel = $('[data-step-panel]', g), count = $('[data-step-count]', g);
  var prev = $('[data-step-prev]', g), next = $('[data-step-next]', g), all = $('[data-step-all]', g);
  function set(i) {
    cur = Math.max(0, Math.min(last, i));
    if (svg) svg.classList.toggle('stepping', cur > 0);
    nodes.forEach(function (n) { n.classList.toggle('cur', +n.getAttribute('data-step') === cur); });
    var s = steps[cur] || {};
    if (panel) panel.innerHTML = '<div class="k">' + (cur ? cur + ' / ' + last : esc(s.k || 'overview')) + '</div><h4>' + esc(s.t || '') + '</h4><p>' + esc(s.p || '') + '</p>' + (s.x ? '<p class="tech">' + esc(s.x) + '</p>' : '');
    if (count) count.textContent = cur ? cur + ' / ' + last : '';
    if (prev) prev.disabled = cur === 0;
    if (next) next.disabled = cur === last;
  }
  nodes.forEach(function (n) {
    var i = +n.getAttribute('data-step');
    if (!n.hasAttribute('aria-label') && steps[i]) n.setAttribute('aria-label', i + ': ' + esc(String(steps[i].t || '')));
    n.addEventListener('click', function () { set(i); });
  });
  if (prev) prev.addEventListener('click', function () { set(cur - 1); });
  if (next) next.addEventListener('click', function () { set(cur + 1); });
  if (all) all.addEventListener('click', function () { set(0); });
  set(0);
});

/* scenarios */
$$('[data-scenarios]').forEach(function (g) {
  var map = island($('script[data-scenario-map]', g)) || {}, btns = $$('[data-sc]', g), els = $$('[data-el]', g), outs = $$('[data-sc-out]', g);
  function set(k) {
    var s = map[k]; if (!s) return;
    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-sc') === k ? 'true' : 'false'); });
    els.forEach(function (el) { var id = el.getAttribute('data-el'); el.classList.toggle('down', (s.down || []).indexOf(id) > -1); el.classList.toggle('off', (s.off || []).indexOf(id) > -1); });
    outs.forEach(function (o) { o.textContent = (s.out || {})[o.getAttribute('data-sc-out')] || ''; });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-sc')); }); });
  if (btns[0]) set(btns[0].getAttribute('data-sc'));
});

/* filters */
$$('[data-filter]').forEach(function (g) {
  var btns = $$('[data-f]', g), items = $$('[data-tags]', g);
  function set(f) {
    btns.forEach(function (b) { var on = b.getAttribute('data-f') === f; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    items.forEach(function (it) { it.hidden = f !== 'all' && it.getAttribute('data-tags').split(/\s+/).indexOf(f) < 0; });
  }
  btns.forEach(function (b) { b.addEventListener('click', function () { set(b.getAttribute('data-f')); }); });
  set('all');
});

wire(document);
onScroll();
})();
</script>
</body>
</html>
