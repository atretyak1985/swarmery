<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0F12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Swarmery</title>
    <!-- Swarmery v4 type pair (D-2): IBM Plex Sans for the UI and headlines, with
         its Cyrillic subset served through unicode-range; JetBrains Mono for
         every number, eyebrow, label and button. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-paint theme (Fusion phase 16): public/theme-boot.js applies the saved
         mode/palette to <html> before first paint. A classic blocking script
         from a file, not inline: the daemon serves this shell with
         script-src 'self', which runs no inline script. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
