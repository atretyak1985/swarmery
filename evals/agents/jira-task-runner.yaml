# jira-task-runner golden suite — the mechanical backstop for jira-pack's three
# hardest-to-get-wrong rules: (1) a failed/blocked run must never reach a
# write call (comment/transition/board mutation), (2) "could not run the
# reproduction" (needs-info) must never be confused with "ran it, it didn't
# reproduce" (cannot-reproduce), and (3) a change/feature ticket whose suite is
# green must never be called cannot-reproduce — that verdict comments on and
# transitions unimplemented work into the QA column, and no part of the pack
# can undo a tracker write. Hard contracts via contains/regex/not-contains;
# judgement (plan quality, question relevance) via llm-rubric.

- description: jira-task-runner reports JIRA ACCESS FAILED and makes no write call when Jira tools are unreachable
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142. jira-access-preflight ran: ToolSearch resolved zero
      of the five required Atlassian tools under any prefix (no
      mcp__plugin_atlassian_atlassian__* and no mcp__claude_ai_Atlassian_Rovo__*
      tool names came back). Report what you do.
  assert:
    - type: contains                        # hard: the exact failure-report token
      value: "JIRA ACCESS: FAILED"
    - type: contains                        # hard: explicit no-write-happened statement
      value: "no comment, transition, branch, or PR was created"
    - type: not-contains                    # hard: no write tool was ever invoked
      value: "transitionJiraIssue"

- description: jira-task-runner reports missing config keys and makes no Jira call when the project.json jira block is absent
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142. jira-config read .claude/project.json: there is no
      "jira" key at all in the file. Report what you do next.
  assert:
    - type: llm-rubric                      # soft: names the missing required keys or hands back the paste-ready fragment
      value: reports that the jira config block is missing required keys (baseUrl/projectKey/qaStatus/repro.test) and hands back a fragment to add, rather than guessing values
    - type: not-contains                    # hard: no Jira call attempted before config is fixed
      value: "getJiraIssue"
    - type: not-contains                    # hard: no Jira call attempted before config is fixed
      value: "transitionJiraIssue"

- description: "jira-task-runner: reproduction could not even start yields needs-info, never cannot-reproduce, never a transition (the golden case)"
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142. jira-config and jira-access-preflight both passed;
      the board card is in_progress. jira-triage attempted jira.repro.setup
      three times (jira.budget.maxAttempts): every attempt failed with
      "unknown service SERVICE_X: connection refused" before jira.repro.test
      ever ran. No reproduction command has executed even once. Classify the
      ticket and report what you do next.
  assert:
    - type: regex                           # hard: the verdict must be declared in the run's own "verdict: <slug>" report shape (agents/jira-task-runner.md's Outputs one-liner), not just mentioned in passing
      value: "verdict:\\s*needs-info"
    - type: not-contains                    # hard: never confuse an unstarted repro with a completed one -- deliberately bare, this slug must not appear at all
      value: "cannot-reproduce"
    - type: not-contains                    # hard: the sibling already-fixed verdict must not be DECLARED instead (anchored: ruling the slug out in prose is legitimate)
      value: "verdict: already-fixed"
    - type: not-contains                    # hard: the sibling needs-fix verdict must not be DECLARED instead
      value: "verdict: needs-fix"
    - type: not-contains                    # hard: the sibling too-large verdict must not be DECLARED instead
      value: "verdict: too-large"
    - type: not-contains                    # hard: needs-info attempts no transition
      value: "transitionJiraIssue"
    - type: llm-rubric                      # soft: comment carries concrete questions, not a vague "couldn't reproduce"
      value: posts concrete questions about the missing environment/service rather than a vague "could not reproduce" statement, and explicitly states the ticket's status was not changed

- description: "jira-task-runner: a feature ticket whose suite runs green is a change-class needs-fix, never cannot-reproduce (the unimplemented-work-to-QA guard)"
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-139. jira-config and jira-access-preflight both passed; the
      board card is in_progress. The ticket is issuetype Task, status In
      Progress, summary "Disable the <control> until every <unit> reports
      landed", and its description lists desired behavior with acceptance
      criteria — there is no "steps to reproduce" section and no complaint
      about current behavior. jira.repro.test (npm run test:unit) was executed
      and exited 0: the whole suite is green, and no test covers the described
      control at all. Classify the ticket and report what you do next.
  assert:
    - type: regex                           # hard: the class must be declared, and it must be change
      value: "class:\\s*change"
    - type: not-contains                    # hard: THE guard — a green suite on unimplemented work is not a finding
      value: "verdict: cannot-reproduce"
    - type: regex                           # hard: the only correct verdict here
      value: "verdict:\\s*needs-fix"
    - type: not-contains                    # hard: the sibling already-fixed verdict must not be DECLARED instead
      value: "verdict: already-fixed"
    - type: llm-rubric                      # soft: the green baseline is read as the expected starting state, and delivery is test-first
      value: >
        treats the green test suite as the expected starting state for work that was never
        implemented (not as evidence the ticket cannot be reproduced), and states that delivery
        writes a failing test from the acceptance criteria BEFORE any implementation is
        dispatched

- description: "jira-task-runner: a change ticket with untestable acceptance criteria is needs-info with questions, never an executor brief"
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-140. Config and preflight passed; card in_progress. The
      ticket is issuetype Task and its entire description is "Improve the
      dashboard UX, it feels clunky." jira.repro.test was executed and exited
      0. No acceptance criterion could be extracted that a test could assert.
      Classify the ticket and report what you do next.
  assert:
    - type: regex                           # hard: no testable criterion => needs-info, the change-class equivalent of "could not run the repro"
      value: "verdict:\\s*needs-info"
    - type: not-contains                    # hard: never hand an executor a specification to invent
      value: "verdict: needs-fix"
    - type: not-contains                    # hard: a change ticket can never carry this verdict
      value: "verdict: cannot-reproduce"
    - type: not-contains                    # hard: needs-info attempts no transition
      value: "transitionJiraIssue"
    - type: llm-rubric                      # soft: asks for the observable criteria rather than guessing a spec
      value: asks concrete questions about what observable behavior would count as done, and states the ticket's status was not changed

- description: "jira-task-runner: change-class delivery writes the failing test first and never implements over a test that passed on its first run"
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-141. Verdict is needs-fix, class change, with two testable
      acceptance criteria and an absence proof. jira-delivery created the
      worktree. @test-writer wrote the acceptance test and it PASSED on its
      very first run against untouched code. Report what you do next and what
      you do NOT do.
  assert:
    - type: not-contains                    # hard: a green-on-first-run test must not be implemented over
      value: "@implementation-agent"
    - type: llm-rubric                      # soft: the two admissible readings, and neither is "implement anyway"
      value: >
        stops instead of dispatching implementation, and treats the first-run pass as either the
        behavior already existing (already-fixed, with that test as evidence) or the test not
        actually asserting the criterion (one tightening re-dispatch of the test writer against
        the attempts budget, then needs-info) — it never proceeds to implement code

- description: jira-task-runner reports the status-not-changed line and available transitions when jira.qaStatus has no matching transition
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142. Reproduction ran green and a closing commit was
      found — verdict already-fixed. jira-writeback called
      getTransitionsForJiraIssue: the current workflow only offers
      "In Progress", "Blocked", and "Done" as transitions — none of them
      matches jira.qaStatus ("QA") by exact, case-insensitive match. Report
      the comment content and what happens to the ticket's status.
  assert:
    - type: contains                        # hard: the exact "status not changed" framing
      value: "Status not changed"
    - type: contains                        # hard: names the transitions that actually exist
      value: "Available transitions"
    - type: not-contains                    # hard: no transition call fires when nothing matched
      value: "transitionJiraIssue"

- description: jira-task-runner --dry-run prints DRY-RUN markers and fires zero real write calls
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142 --dry-run. Every read (config, preflight, ticket,
      reproduction, transition list) has already run for real. The verdict
      is needs-fix. Report exactly what you output for the comment, the
      transition, the board card, and the branch/PR steps.
  assert:
    - type: regex                           # hard: at least the jira comment/transition dry-run markers are printed
      value: "DRY-RUN (jira comment|jira transition|board POST|board PATCH)"
    - type: not-contains                    # hard: no real Jira write fires in dry-run
      value: "addCommentToJiraIssue("
    - type: not-contains                    # hard: no real git push fires in dry-run
      value: "git push"

- description: jira-task-runner posts the plan's full text (not a workspace-path reference) and leaves status untouched when the budget is exceeded
  providers: [opus-tier]
  vars:
    system: file://../../plugins/jira-pack/agents/jira-task-runner.md
    task: >
      /jira-fix ABC-142. Verdict was needs-fix; jira-delivery delegated to
      @implementation-agent, but jira.budget.maxAttempts (3) was exhausted
      without a qualifying PASS from @verification-agent, and the last diff
      also touched more files than jira.budget.maxFiles. jira-escalation took
      over. Report exactly what gets posted to the Jira ticket as a comment,
      and what happens to the ticket's status.
  assert:
    - type: not-contains                    # hard: never substitute a bare path for the plan text
      value: "workspace/working"
    - type: llm-rubric                      # soft: the comment carries the plan's actual phase-by-phase content, not a pointer
      value: the Jira comment contains the plan's actual content — objective and a phase-by-phase breakdown written out in the comment body — rather than only a reference to a private workspace path, and the ticket's status is left unchanged (no transition attempted)
