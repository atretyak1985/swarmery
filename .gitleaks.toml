# gitleaks config for the swarmery repo.
# The CI secret-scan job runs `gitleaks detect --log-opts=--all`, i.e. over the
# FULL history, so it re-scans historical blobs that predate any in-place fix.
# `[extend] useDefault = true` keeps the entire built-in ruleset; the allowlists
# below only carve out known-safe, non-secret test fixtures.

[extend]
useDefault = true

[[allowlists]]
description = "Redaction unit-test fixtures — deliberately fake/example secrets used to prove the log redactor scrubs them. Path-scoped so real secrets elsewhere are still caught."
paths = [
  '''tools/swarmery/internal/api/system_test\.go''',
]

[[allowlists]]
description = "The PUBLIC first-party OAuth client id, sent as client_id on the refresh_token grant (internal/usage/claude.go). An OAuth client identifier is non-confidential by design (RFC 6749 s2.2) — it ships in the Claude CLI itself; generic-api-key only flags it because a UUID scores 3.72 entropy. Scoped to this one literal value rather than to the file, so a real secret added next to it is still caught."
regexTarget = "line"
regexes = [
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',
]

[[allowlists]]
description = "planrev store tests — fixture doc filenames like `phase-3-api.md` inside a wantOrder slice trip generic-api-key (the literal `api` keyword next to a quoted string); nothing in this file is credential-shaped. Path-scoped so real secrets elsewhere are still caught."
paths = [
  '''tools/swarmery/internal/planrev/store_test\.go''',
]

[[allowlists]]
description = "internal/usage test fixtures — the live-quota path is built around an OAuth bearer, so its tests must carry `sk-ant`-shaped strings to prove the redactor scrubs them and that no token reaches a DTO. Every value here is a literal NOT-A-REAL/FAKE placeholder. Path-scoped, so a real credential committed anywhere else is still caught."
paths = [
  '''tools/swarmery/internal/usage/claude_test\.go''',
  '''tools/swarmery/internal/usage/creds_test\.go''',
  '''tools/swarmery/internal/usage/testdata/credentials\.json''',
  '''tools/swarmery/internal/api/usage_test\.go''',
]

[[allowlists]]
description = "repoprovider / phase-landing test fixtures — the VCS landing path stores and redacts gh/glab tokens, so its tests must carry `ghp_`/`glpat-`-shaped literals (e.g. `glpat-selfhostedselfhosted00`) to prove the credstore redactor scrubs them and that no token reaches a 422 body or a log line. Every value is a literal placeholder; the production redactor (credstore.go, api/redact.go) is what these tests pin. Scoped to *_test.go under repoprovider and the three api test files, so a real credential committed anywhere else is still caught."
paths = [
  '''tools/swarmery/internal/repoprovider/.*_test\.go''',
  '''tools/swarmery/internal/api/phase_landing_test\.go''',
  '''tools/swarmery/internal/api/vcs_test\.go''',
  '''tools/swarmery/internal/api/tasks_review_test\.go''',
]
